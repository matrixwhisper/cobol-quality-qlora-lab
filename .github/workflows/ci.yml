name: COBOL quality tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
      - name: Install Python test dependencies
        run: python -m pip install "scikit-learn>=1.4,<2" "joblib>=1.3,<2" "pytest>=8,<9"
      - name: Run tests
        run: python -m pytest -q